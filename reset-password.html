<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8B1A2B">
<title>Basso Services Viticoles — Nueva contraseña</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--g:#8B1A2B;--gl:#F5E6E8;--gd:#6B1220;--gold:#C9A84C;--goldl:#FBF3D5;--r:#E24B4A;--rl:#FCEBEB;--bg:#fff;--bg2:#f8f8f7;--text:#1a1a1a;--text2:#6b6b6b;--text3:#999;--border:#e5e5e3;--border2:#d0d0cd;--radius:8px;--radius-lg:12px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg2);color:var(--text);font-size:14px}
input,button{font-family:inherit}
input{width:100%;padding:6px 9px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text)}
input:focus{outline:none;border-color:var(--g)}
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.fl{font-size:12px;color:var(--text2);font-weight:500}
.btn{padding:5px 12px;font-size:12px;border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;background:var(--bg);color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.btn:hover{background:var(--bg2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-g{background:var(--g);border-color:var(--g);color:#fff}.btn-g:hover{background:var(--gd)}
.btn-lg{padding:12px 24px;font-size:14px;font-weight:600;width:100%;justify-content:center}

.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6B1220 0%,#8B1A2B 50%,#C9A84C 100%);padding:20px}
.login-box{background:var(--bg);border-radius:20px;padding:36px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:20px}
.login-logo img{width:110px;height:110px;object-fit:contain;border-radius:50%}
.login-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:4px;color:var(--g)}
.login-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:20px}
.login-err{background:var(--rl);color:#791F1F;border:1px solid var(--r);border-radius:var(--radius);padding:8px 12px;font-size:13px;margin-bottom:14px;text-align:center}
.login-ok{background:#E9F7EF;color:#1E7A34;border:1px solid #4ade80;border-radius:var(--radius);padding:8px 12px;font-size:13px;margin-bottom:14px;text-align:center}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.back-link{text-align:center;margin-top:16px}
.back-link a{font-size:12px;color:var(--text2);text-decoration:none}
.back-link a:hover{color:var(--g)}
</style>
</head>
<body>

<div class="login-page">
  <div class="login-box">
    <div class="login-logo"><img src="https://i.postimg.cc/bvDHmp47/WhatsApp-Image-2026-05-14-at-17-24-20-(6).jpg" alt="Basso" onerror="this.style.display='none'"></div>
    <div class="login-title">Basso Services Viticoles</div>
    <div class="login-sub" id="sub">Define tu nueva contraseña</div>

    <div class="login-err" id="err" style="display:none"></div>
    <div class="login-ok" id="ok" style="display:none"></div>

    <div id="form-wrap">
      <div class="fg"><label class="fl">Nueva contraseña</label><input type="password" id="p1" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>
      <div class="fg"><label class="fl">Repite la contraseña</label><input type="password" id="p2" autocomplete="new-password"></div>
      <button class="btn btn-g btn-lg" style="margin-top:6px" id="btn" onclick="guardar()"><i class="ti ti-check"></i> Guardar nueva contraseña</button>
    </div>

    <div class="back-link"><a href="./index.html"><i class="ti ti-arrow-left"></i> Volver al ERP</a></div>
  </div>
</div>

<script>
const SB='https://yopdehtfbfjdaocnbmgo.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvcGRlaHRmYmZqZGFvY25ibWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDI5NDcsImV4cCI6MjA5Nzk3ODk0N30.yoMs_TaBFcJWvjSAzzr11gson31iwUXNO-UCCpdo1c8';
const _supa=supabase.createClient(SB,SK);

const err=document.getElementById('err'),ok=document.getElementById('ok'),sub=document.getElementById('sub');

// Supabase entrega el enlace de recuperación con un token en la URL.
// supabase-js lo detecta automáticamente y dispara PASSWORD_RECOVERY
// con una sesión temporal ya activa.
let sesionLista=false;
_supa.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){
    sesionLista=true;
    sub.textContent='Enlace verificado. Define tu nueva contraseña.';
  }
});

// Si tras unos segundos no llegó el evento (enlace caducado, ya usado,
// o abierto sin token), avisamos en vez de dejar el formulario mudo.
setTimeout(()=>{
  if(!sesionLista){
    _supa.auth.getSession().then(({data})=>{
      if(!data.session){
        err.textContent='Este enlace no es válido o ha caducado. Pide uno nuevo desde "¿Olvidaste tu contraseña?" en el login.';
        err.style.display='block';
        document.getElementById('form-wrap').style.display='none';
      }
    });
  }
},2500);

async function guardar(){
  err.style.display='none';ok.style.display='none';
  const p1=document.getElementById('p1').value;
  const p2=document.getElementById('p2').value;
  if(p1.length<6){err.textContent='La contraseña debe tener al menos 6 caracteres.';err.style.display='block';return;}
  if(p1!==p2){err.textContent='Las dos contraseñas no coinciden.';err.style.display='block';return;}
  const btn=document.getElementById('btn');btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Guardando...';
  try{
    const {error}=await _supa.auth.updateUser({password:p1});
    if(error)throw error;
    ok.textContent='✅ Contraseña actualizada. Ya puedes volver al ERP y entrar con tu email y la nueva contraseña.';
    ok.style.display='block';
    document.getElementById('form-wrap').style.display='none';
  }catch(e){
    err.textContent='No se pudo guardar: '+e.message;err.style.display='block';
    btn.disabled=false;btn.innerHTML='<i class="ti ti-check"></i> Guardar nueva contraseña';
  }
}
</script>
</body>
</html>
